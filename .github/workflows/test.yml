name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      artifact:
        description: "Name of an artifact holding a candidate corntchap-cli.json to test in place of the committed one (the update workflow's, before it pushes)"
        required: false
        type: string
        default: ""
permissions:
  contents: read
env:
  # Scoop's manifest schema, pinned to a commit so a schema change cannot break this suddenly
  SCOOP_SCHEMA: https://raw.githubusercontent.com/ScoopInstaller/Scoop/e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f/schema.json
  # the Scoop installer script, pinned to a commit (it still downloads Scoop itself from its master branch)
  SCOOP_INSTALLER: https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: shellcheck scripts/*.sh && shellcheck -e SC2319,SC2016 tests/*.sh
      - name: render-manifest.sh guards
        run: tests/render-manifest.test.sh
      - name: every guard is covered (mutation)
        run: tests/mutate.sh
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: inputs.artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact }}
          path: candidate
      - if: inputs.artifact != ''
        shell: bash
        run: cp "candidate/corntchap-cli.json" bucket/corntchap-cli.json
      - name: validate the manifest against Scoop's schema
        run: |
          curl -fsSL "$SCOOP_SCHEMA" -o schema.json
          npx -y ajv-cli@5.0.0 validate -s schema.json -d bucket/corntchap-cli.json --strict=false
  install:
    needs: [scripts, schema]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: inputs.artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact }}
          path: candidate
      - if: inputs.artifact != ''
        shell: bash
        run: cp "candidate/corntchap-cli.json" bucket/corntchap-cli.json
      - name: is there a release to install?
        id: gate
        shell: bash
        run: |
          # the committed manifest carries an all-zero placeholder hash until the update workflow has seen a release
          if grep -qE '"hash": "0{64}"' bucket/corntchap-cli.json; then
            echo "No release rendered yet (all-zero placeholder hash); skipping the install test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: install Scoop
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri $env:SCOOP_INSTALLER -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"
      - name: scoop install from the manifest
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: scoop install .\bucket\corntchap-cli.json
      - name: corntchap-cli --version
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          $want = "corntchap-cli " + (Get-Content bucket\corntchap-cli.json | ConvertFrom-Json).version
          $got = (corntchap-cli --version | Out-String).Trim()
          Write-Host $got
          if ($got -ne $want) { throw "expected '$want', got '$got'" }
